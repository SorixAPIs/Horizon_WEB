    <!-- Apply a stored colour theme before first paint (no flash). The try/catch
         keeps a localStorage failure (private mode) from breaking anything. -->
    <script>
        try {
            var t = localStorage.getItem('hexion-theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
    </script>

    <!-- ASSET_VERSION caches pasted below: bump it whenever these files change
         and the change must be visible at once (see README → Deployment). -->
    <link rel="stylesheet" href="assets/themes.css?v=20261009-2">
    <link rel="stylesheet" href="assets/index.css?v=20261009-2">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030304">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="The page you were looking for on Hexion.fun does not exist — it may have been moved or renamed. Head back to the homepage or check the system status.">

    <title>Hexion.fun — 404, page not found</title>

    <!-- Absolute paths on purpose: this file is served for ANY unknown URL
         (/anything/at/all), so relative asset links would break on deep paths. -->
    <link rel="icon" type="image/png" href="/assets/hexion_nobg.png">
    <link rel="apple-touch-icon" href="/assets/hexion_nobg.png">

    <!-- Apply a stored colour theme before first paint (no flash). -->
    <script>
        var t = null;
        try { t = localStorage.getItem('hexion-theme'); } catch (e) {}
        /* The saved id must still exist in the switcher — anything else
           (including a blocked localStorage) falls back to the default. */
        document.documentElement.setAttribute('data-theme',
            t === 'hexion' || t === 'halloween' ? t : 'hexion');
    </script>

    <link rel="stylesheet" href="/assets/themes.css?v=20261009-3">
    <link rel="stylesheet" href="/assets/index.css?v=20261009-3">
</head>

<body oncontextmenu="return false">
    <div class="page">
        <nav class="nav">
            <a class="brand" href="/">
                <span class="brand-mark">
                    <!-- The bundled copy is byte-identical to the CDN original
                         (verified by SHA-256), so the error page renders from
                         disk alone: no http:// request that an https:// host
                         would reject as mixed content before falling back. -->
                    <img src="/assets/hexion.png" alt="">
                </span>
                <span>HEXION.FUN</span>
            </a>
            <a class="nav-ghost" href="/">Back to Hexion.fun</a>
        </nav>

        <main class="coming-page">
            <span class="err-ghost" aria-hidden="true">404</span>

            <div class="coming-icon">
                <!-- lucide: search-x -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    <path d="m9 9 6 6"></path>
                    <path d="m15 9-6 6"></path>
                </svg>
            </div>

            <div class="page-kicker">ERROR 404</div>

            <h1>Lost the thread.</h1>

            <p>That page doesn&rsquo;t exist &mdash; it may have been moved, renamed, or the
               link you followed is broken. Nothing is wrong with Hexion.fun itself.</p>

            <div class="err-actions">
                <a class="btn btn-primary" href="/">Back to Hexion.fun</a>
                <a class="btn btn-secondary" href="/#status">Check system status</a>
            </div>

            <span class="err-path" id="path" hidden></span>
        </main>

        <footer>
            <span>Hexion.fun &mdash; your scripts, your space.</span>
            <span>404 &middot; not found</span>
        </footer>
    </div>

    <script src="/assets/theme.js?v=20261009-3"></script>
    <script>
        /* Show which URL missed, so broken links are easy to spot.
           Hidden by default so the page is complete without JavaScript. */
        (function () {
            var el = document.getElementById('path');
            if (!el) return;
            el.textContent = document.location.pathname;
            el.hidden = false;
        })();
    </script>
</body>
</html>
